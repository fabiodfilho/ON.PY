<!DOCTYPE html>
<html lang="pt-br" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>on.py - Novo Endereço</title>
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    
    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Montserrat', 'sans-serif'],
                },
                colors: {
                    brand: {
                        50: '#F5F3FF',
                        100: '#EDE9FE',
                        500: '#7C3AED',
                        600: '#2A00A2',
                        700: '#1F007A',
                        800: '#140052',
                        900: '#0B0033',
                        footer: '#080121'
                    }
                },
                // NOVAS ANIMAÇÕES
                keyframes: {
                    fadeInUp: {
                        '0%': { opacity: '0', transform: 'translateY(20px)' },
                        '100%': { opacity: '1', transform: 'translateY(0)' }
                    },
                    float: {
                        '0%, 100%': { transform: 'translateY(0)' },
                        '50%': { transform: 'translateY(-10px)' }
                    },
                    pulseGlow: {
                        '0%, 100%': { boxShadow: '0 0 0 0 rgba(124, 58, 237, 0.4)' },
                        '50%': { boxShadow: '0 0 20px 10px rgba(124, 58, 237, 0)' }
                    }
                },
                animation: {
                    'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    'fade-in-delayed': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards',
                    'float': 'float 4s ease-in-out infinite',
                    'pulse-glow': 'pulseGlow 2.5s infinite'
                }
            }
        }
    }
</script>

<style>
    /* Suavizador global para transições */
    body {
        transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
    }
    .page-exit {
        opacity: 0 !important;
        transform: translateY(-8px) scale(0.99) !important;
    }
    /* Efeito Glassmorphism para o card central */
    .glass-card {
        background: rgba(255, 255, 255);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.8);
    }
</style>
</head>
<body class="bg-[#040322] text-slate-900 font-sans min-h-full flex flex-col justify-between antialiased selection:bg-brand-500 selection:text-white relative overflow-hidden">

    <!-- Orbes sutis de fundo para profundidade visual (Agora animados) -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[500px] bg-gradient-to-tr from-brand-500/20 via-purple-300/30 to-brand-500/10 blur-3xl pointer-events-none -z-10 rounded-full animate-float" style="animation-duration: 7s;"></div>

    <!-- Header / Navbar Minimalista -->
    <header class="w-full pt-6 px-4 sm:px-6 lg:px-8 flex justify-center animate-fade-in-up">
        <nav class="bg-white backdrop-blur-md border border-slate-200/60 shadow-sm rounded-full px-8 py-3 flex items-center justify-center w-full max-w-4xl transition-all">
            <img class="h-7 w-auto" src="/static/images/Logo_on_py_horizontal.svg" alt="on.py">
        </nav>
    </header>

    <!-- Main Content - Centralizado e Focado -->
    <main class="flex-1 w-full mx-auto px-4 sm:px-6 flex flex-col items-center justify-center text-center relative z-10">
        
        <div class="glass-card rounded-3xl p-8 sm:p-12 max-w-2xl w-full shadow-2xl shadow-brand-500/10 animate-fade-in-up flex flex-col items-center gap-6 transform transition-all duration-500 hover:scale-[1.02]">
            
            <!-- Ícone Animado de Direcionamento -->
            <div class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center animate-float border border-brand-100 shadow-sm mb-2">
                <svg class="w-10 h-10 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                </svg>
            </div>

            <div class="space-y-3">
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">
                    Olá, <span class="bg-gradient-to-r from-brand-600 via-purple-600 to-brand-500 bg-clip-text text-transparent">mudamos nosso endereço!</span>
                </h1>
                <p class="text-lg sm:text-xl text-slate-600 font-medium">
                    agora estamos funcionando em:
                </p>
            </div>

            <!-- Botão com Novo Link -->
            <div class="animate-fade-in-delayed w-full mt-4">
                <a href="https://onpy.unifacisa.edu.br" class="group relative inline-flex items-center justify-center gap-3 w-full sm:w-auto px-8 py-4 bg-brand-600 hover:bg-brand-700 text-white rounded-2xl font-bold text-lg md:text-xl transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-brand-600/40 animate-pulse-glow overflow-hidden">
                    <span class="relative z-10">onpy.unifacisa.edu.br</span>
                    <svg class="w-5 h-5 relative z-10 transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                    <!-- Overlay de hover gradiente -->
                    <div class="absolute inset-0 bg-gradient-to-r from-brand-500 to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                </a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full bg-brand-footer border-t border-slate-800 py-6 px-4 sm:px-6 lg:px-8 mt-auto z-10">
        <div class="max-w-6xl mx-auto flex flex-col items-center justify-center gap-3">
            <img class="h-7 w-auto opacity-90" src="/static/images/Logo_on_py_vertical.svg" alt="on.py">
            <p class="text-xs text-slate-400 font-medium">
                Versão beta 1.0 &bull; Powered by <span class="text-purple-300 hover:text-white transition-colors">@fabiodfilho</span>
            </p>
        </div>
    </footer>

    <script>
        // Mantém o smooth exit se o usuário clicar no botão para navegar
        document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.remove("page-exit");

            document.querySelectorAll('a').forEach(anchor => {
                anchor.addEventListener("click", function (e) {
                    const targetUrl = this.getAttribute("href");

                    if (!targetUrl || targetUrl === "#" || this.target === "_blank") return;

                    e.preventDefault();
                    document.body.classList.add("page-exit");

                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 400); // Sincronizado com o novo tempo de transição
                });
            });
        });
    </script>

</body>
</html>
