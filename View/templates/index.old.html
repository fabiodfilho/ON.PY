<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISpy</title>
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.icoe">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/sispy-style.css">
</head>
<!-- A MÁGICA ACONTECE AQUI: Adicionamos a classe sispy-page -->
<body class="sispy-page">

<div class="logo">
    <img src="/static/images/Logo01.png" alt="SISpy Logo" width="180">
</div>

<div class="container">
    <form id="csvForm">
        <div id="dynamic-fields">
            <div class="field-group-wrapper">
                <div class="field-group">
                    <label>IDs dos cursos (SIS):</label>
                    <textarea name="cursos[]" placeholder="Um por linha"></textarea>

                    <label>Matrículas:</label>
                    <textarea name="matriculas[]" placeholder="Uma por linha"></textarea>
                </div>
                <button type="button" class="remove-btn" title="Remover este bloco">❌</button>
            </div>
        </div>

        <div class="actions">
            <button type="button" class="add-btn" id="btnAdd" title="Adicionar novo bloco">+</button>
            <button type="submit" class="submit-btn">GERAR ARQUIVO CSV</button>
        </div>
    </form>
</div>

<div id="confirmToast" class="toast" role="dialog" aria-live="polite" aria-modal="true">
    <p id="toastMessage"></p>
    <div class="toast-actions">
        <button type="button" id="toastCancel" class="toast-btn cancel">Cancelar</button>
        <button type="button" id="toastConfirm" class="toast-btn confirm">Prosseguir</button>
    </div>
</div>

<div class="system-banner">
    <img src="/static/images/banner-sispy.png" alt="O sis.py vai evoluir" class="system-banner-image">
</div>

<div class="footer">
    Versão beta 4.0 - Powered by @fabiodfilho
</div>

<script>
    const form = document.getElementById("csvForm");
    const submitBtn = document.querySelector(".submit-btn");
    const toast = document.getElementById("confirmToast");
    const toastMessage = document.getElementById("toastMessage");
    const toastConfirm = document.getElementById("toastConfirm");
    const toastCancel = document.getElementById("toastCancel");

    function setSubmitting(isSubmitting) {
        submitBtn.disabled = isSubmitting;
        submitBtn.textContent = isSubmitting ? "GERANDO..." : "GERAR ARQUIVO CSV";
    }

    function showToast(message, onConfirm) {
        toastMessage.textContent = message;
        toast.classList.add("show");

        toastConfirm.onclick = function() {
            toast.classList.remove("show");
            onConfirm();
        };

        toastCancel.onclick = function() {
            toast.classList.remove("show");
            setSubmitting(false);
        };
    }

    async function enviarCsv(formData) {
        setSubmitting(true);

        try {
            const response = await fetch("/gerar-csv", {
                method: "POST",
                body: formData
            });

            const contentType = response.headers.get("content-type") || "";

            if (contentType.includes("application/json")) {
                const data = await response.json();

                if (data.requires_confirmation) {
                    showToast(`${data.message} Códigos: ${data.missing_codes.join(", ")}`, () => {
                        formData.set("prosseguir_com_codigos_nao_encontrados", "1");
                        enviarCsv(formData);
                    });
                    return;
                }

                if (!response.ok) {
                    alert(data.error || "Erro ao gerar o CSV.");
                    return;
                }
            } else {
                if (!response.ok) {
                    const errorText = await response.text();
                    alert(errorText);
                    return;
                }
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "matriculas_sis.csv";
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
        } catch (err) {
            alert("Erro ao conectar com o servidor.");
        } finally {
            setSubmitting(false);
        }
    }

    document.getElementById("btnAdd").addEventListener("click", function() {
        const container = document.getElementById("dynamic-fields");

        const firstWrapper = container.querySelector(".field-group-wrapper");
        const newWrapper = firstWrapper.cloneNode(true);

        newWrapper.querySelectorAll("textarea").forEach(t => t.value = "");

        newWrapper.classList.add("show-remove");

        newWrapper.querySelector(".remove-btn").addEventListener("click", function() {
            newWrapper.remove();
        });

        container.appendChild(newWrapper);

        newWrapper.scrollIntoView({ behavior: 'smooth', block: 'end' });
    });

    form.addEventListener("submit", function(e) {
        e.preventDefault();
        const formData = new FormData(form);
        enviarCsv(formData);
    });
</script>
</body>
</html>
